<!doctype html>

<style>

<body>
<div id="stage"><div class="bg"></div><div class="dots"></div><div class="top"><img id="logo" alt=""><span id="course"></span><span class="day" id="dayname"></span></div><div class="sub" id="sub"></div><div class="progress" id="progress"></div></div>
<script>
const S = __SENARYO__;
const Z0 = __ZAMAN__;   // uret.py: sese göre zaman çizelgesi + dudak senkronu. null ise sure_sn'den hesaplanır (sessiz önizleme).
const RIG = __RIG__;    // Piko dudak senkronu parçaları (maskotlar/piko-python/konusma-rig/rig.json)
const ROOT = "__ROOT__";   // repo köküne göreli yol
const V = new URLSearchParams(location.search).get("o") === "v";
if (V) document.body.classList.add("v");
const JS = S.kurs === "javascript";
const DIL = S.dil || "tr";
document.documentElement.lang = DIL;  // büyük harf dönüşümü (i → İ / I) dile göre
const TXT = {
  tr: { course: JS ? "30 Günde JavaScript" : "30 Günde Python", day: "Gün", output: "Çıktı", error: "Hata", see: "Görüşmek üzere", learn: "Bu derste", stage: "Sahne", think: "Düşün!", run: "Çalıştır", file: JS ? "kod.js" : "kod.py" },
  en: { course: JS ? "JavaScript in 30 Days" : "Python in 30 Days", day: "Day", output: "Output", error: "Error", see: "See you soon", learn: "In this lesson", stage: "Stage", think: "Think!", run: "Run", file: JS ? "code.js" : "code.py" },
}[DIL];
const MK = JS ? "kodi-javascript" : "piko-python";
const stage = document.getElementById("stage");
stage.classList.add("theme-" + S.kurs);
stage.style.setProperty("--space", `url(${ROOT}gorseller/javascript/arka-plan/${V ? "bg-space.webp" : "bg-space-wide.webp"})`);
const LOGO = ROOT + (JS ? "gorseller/javascript/simgeler/favicon-96.png" : "gorseller/python/logo-128.png");
document.getElementById("logo").src = LOGO;
document.getElementById("course").textContent = TXT.course;
document.getElementById("dayname").textContent = `· ${TXT.day} ${S.gun}`;
const topBar = stage.querySelector(".top");
const subEl = document.getElementById("sub");
const progEl = document.getElementById("progress");

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const KW = JS
  ? /\b(const|let|var|function|return|if|else|for|while|of|in|new|class|extends|async|await|try|catch|finally|throw|switch|case|break|continue|default|true|false|null|undefined|this|typeof|import|export|from)\b/
  : /\b(def|return|if|elif|else|for|while|in|not|and|or|import|from|as|class|try|except|finally|raise|with|True|False|None|lambda|pass|break|continue|global|is)\b/;
const KWFULL = new RegExp("^(?:" + KW.source + ")$");
const isKw = (t) => KWFULL.test(t);
function highlight(line) {
  const re = JS
    ? /(\/\/.*$)|("(?:\\.|[^"])*"|'(?:\\.|[^'])*'|`(?:\\.|[^`])*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)/g
    : /(#.*$)|(f?"(?:\\.|[^"])*"|f?'(?:\\.|[^'])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const [t] = m;
    if (m[1]) out += `<span class="t-c">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="t-s">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="t-n">${esc(t)}</span>`;
    else if (isKw(t)) out += `<span class="t-k">${esc(t)}</span>`;
    else if (m[4]) out += `<span class="t-f">${esc(t)}</span>`;
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(line.slice(last));
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// ---- zaman çizelgesi (ses yoksa sure_sn'den) ----
function fallbackZaman() {
  const segs = []; let t = 0;
  const split = (txt) => (txt || "").split(/(?<=[.!?…])\s+/).filter(Boolean);
  const add = (tip, tur, dur, text, extra) => {
    const parts = split(text); const tot = parts.reduce((a, p) => a + p.length, 0) || 1; let acc = 0;
    const v0 = t + 0.4, v1 = t + dur - 0.6;
    const subs = parts.map((p) => { const a = v0 + (v1 - v0) * acc / tot; acc += p.length; return { a, b: v0 + (v1 - v0) * acc / tot, text: p }; });
    const s = { tip, tur, t0: t, t1: t + dur, v0, v1, subs, ...extra };
    const ek = (extra.i != null && S.sahneler[extra.i].ekran) || {};
    if (ek.kod) { s.typ0 = t + dur * 0.05; s.typ1 = t + dur * 0.45; if (ek.cikti) s.out_at = t + dur * 0.5; if (ek.duzeltme) s.fix_at = t + dur * 0.78; }
    if (tur === "soru") s.sayac = t + dur - 3.2;
    segs.push(s); t += dur;
  };
  if (S.giris) add("giris", "giris", 7, S.giris.anlatim, {});
  S.sahneler.forEach((s, i) => add("sahne", s.tur, s.sure_sn, s.anlatim, { i }));
  if (S.cikis) add("cikis", "cikis", 9, S.cikis.anlatim, {});
  return { sure: t, segs, agiz: null };
}
const Z = Z0 || fallbackZaman();
window.DURATION = Z.sure;

// ---- maskot (Piko: dudak senkronu) ----
const poseSrc = (poz) => `${ROOT}maskotlar/${MK}/pozlar/${poz}.png`;
const rigSrc = (f) => `${ROOT}maskotlar/piko-python/konusma-rig/${f}`;
function mouthAt(t) {
  if (!Z.agiz) return { o: 0, g: "k" };
  const k = Math.max(0, Math.min(Z.agiz.length - 1, Math.round(t * Z.env_fps)));
  return { o: Z.agiz[k] / 100, g: Z.gorus[k] };
}
function rigLayer(poz, cls) {
  const r = RIG && RIG.pozlar[poz];
  const L = document.createElement("div"); L.className = "layer " + cls;
  if (!r) { L.innerHTML = `<img class="base" src="${poseSrc(poz)}">`; return { L, r: null }; }
  const [x, y, w, h] = r.agiz;
  const box = `left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%`;
  if (r.tur === "olcek") {
    L.innerHTML = `<img class="base" src="${rigSrc(poz + "-agizsiz.png")}"><img class="mouth" style="${box}" src="${rigSrc(poz + "-agiz.png")}">`;
  } else {
    L.innerHTML = `<img class="base" src="${poseSrc(poz)}">` + r.kareler.map((v) => `<img class="mouth v-${v}" style="${box};display:none" src="${rigSrc(poz + "-" + v + ".png")}">`).join("");
  }
  return { L, r };
}
function makeMascot(poz, pos, extraCls = "") {
  const el = document.createElement("div");
  el.className = `mascot ${pos} ${extraCls}`;
  const info = RIG && RIG.pozlar[poz];
  const sizeSrc = info ? info.boyut : null;
  const main = rigLayer(poz, "main");
  el.append(main.L);
  let talk = null;
  if (RIG && !main.r && !JS) {  // ağzı kapalı pozlar (dusunme, uzgun): konuşurken önden konuşan Piko'ya geçilir
    talk = rigLayer("on", "talk"); talk.L.style.opacity = 0; el.append(talk.L);
    talk.L.style.aspectRatio = RIG.pozlar.on.boyut.join(" / ");
  }
  const setAspect = (w, h) => { el.style.aspectRatio = `${w} / ${h}`; };
  if (sizeSrc) setAspect(...sizeSrc);
  else { const im = main.L.querySelector("img"); im.addEventListener("load", () => setAspect(im.naturalWidth, im.naturalHeight)); }
  function drive(layer, speakW, m) {
    if (!layer.r) return;
    if (layer.r.tur === "olcek") {
      const k = 0.12 + 0.88 * m.o;
      const s = 1 + (k - 1) * speakW;
      layer.L.querySelector(".mouth").style.transform = `scaleY(${s.toFixed(3)})`;
    } else {
      const g = m.g === "k" ? "kapali" : m.g;
      layer.L.querySelectorAll(".mouth").forEach((im) => { im.style.display = speakW > 0.5 && im.classList.contains("v-" + g) ? "block" : "none"; });
    }
  }
  return {
    el,
    update(t, seg) {
      const speakW = seg.v1 > seg.v0 ? clamp(Math.min((t - seg.v0 + 0.08) / 0.12, (seg.v1 + 0.12 - t) / 0.15)) : 0;
      const m = mouthAt(t);
      if (talk) {
        talk.L.style.opacity = speakW; main.L.style.opacity = 1 - speakW;
        drive(talk, speakW, m);
      } else drive(main, speakW, m);
      return m.o * speakW;
    },
  };
}

// ---- sahneleri kur ----
const TOPPOS = { h: 300, v: 380 };
function buildScene(seg) {
  const s = S.sahneler[seg.i];
  const e = s.ekran || {};
  const m = s.maskot || {};
  const pos = m.konum || "yok";
  const el = document.createElement("div");
  el.className = "scene" + (pos === "sol" || pos === "alt-sol" ? " m-sol" : "") + (e.gorsel && !e.kod ? " has-pic" : "");
  let html = "";
  const big = s.tur === "acilis" || s.tur === "kapanis";
  const title = String(e.baslik || S.baslik).replace(/^(Gün|Day)\s*\d+\s*[:·-]\s*/, "");
  if (big) html += `<div class="title-big h1"><small>${esc(s.tur === "acilis" ? `${TXT.day} ${S.gun}` : TXT.see)}</small>${esc(title)}</div>`;
  else if (e.baslik) html += `<div class="heading h1">${esc(e.baslik)}</div>`;
  const hasCode = !!e.kod;
  if (e.maddeler && e.maddeler.length) {
    const top = big ? 640 : 300;
    html += `<ul class="bullets" style="top:${V ? top + 80 : top}px">${e.maddeler.map((b, i) => `<li data-i="${i}">${esc(b)}</li>`).join("")}</ul>`;
  }
  if (hasCode) {
    const lines = e.kod.replace(/\n$/, "").split("\n");
    const hl = new Set(e.vurgu_satirlari || []);
    html += `<div class="code"><div class="bar"><i style="background:#E8574A"></i><i style="background:#FFC83D"></i><i style="background:#2E9E62"></i><span style="margin-left:12px">${TXT.file}</span>${e.cikti ? `<span class="run">▶ ${TXT.run}</span>` : ""}</div><pre>${lines.map((l, i) => `<span class="ln" data-hl="${hl.has(i + 1) ? 1 : 0}"><span class="n">${i + 1}</span><span class="src" data-src="${esc(l)}"></span></span>`).join("")}</pre></div>`;
  }
  if (e.cikti) html += `<div class="out${s.tur === "hata" ? " err" : ""}"><b>${s.tur === "hata" ? TXT.error : TXT.output}</b><pre>${esc(e.cikti)}</pre></div>`;
  if (e.izgara && e.cikti) {
    const cell = (ch) => ch === "*" ? `<div class="c"><img src="${poseSrc("on")}"></div>` : ch === "#" ? `<div class="c wall"></div>` : ch === "o" ? `<div class="c"><div class="coin"></div></div>` : ch === "H" ? `<div class="c" style="font-size:56px;color:#E8574A">♥</div>` : `<div class="c"></div>`;
    html += `<div class="grid"><b>${TXT.stage}</b>${e.cikti.split("\n").map((r) => `<div class="row">${[...r].map(cell).join("")}</div>`).join("")}</div>`;
  }
  if (s.tur === "soru") html += `<div class="count"><div class="num">3</div><span>${TXT.think}</span></div>`;
  if (e.gorsel && !hasCode) html += `<div class="picture${pos === "sag" || pos === "alt-sag" ? " with-m" : pos === "orta" ? " with-orta" : ""}"><img src="${ROOT}${e.gorsel}" alt=""></div>`;
  el.innerHTML = html;
  let masc = null;
  if (pos !== "yok" && m.poz) { masc = makeMascot(m.poz, pos); el.append(masc.el); }
  stage.insertBefore(el, subEl);
  const codeLines = hasCode ? [...el.querySelectorAll(".src")] : [];
  return { seg, s, e, el, masc, codeLines, codeLen: codeLines.reduce((a, x) => a + x.dataset.src.length, 0), fixed: false };
}
function buildIntro(seg) {
  const g = S.giris;
  const el = document.createElement("div");
  el.className = "scene intro";
  el.innerHTML = `<div class="glow"></div><img class="logo" src="${LOGO}"><div class="brand">${esc(TXT.course)}<small>30gunde.com.tr</small></div>
    <div class="pill">${TXT.day} ${S.gun}</div><div class="title h1">${esc(S.baslik)}</div>
    <div class="learn"><b>${TXT.learn}</b><div class="chips">${(g.maddeler || []).map((b) => `<div class="chip">${esc(b)}</div>`).join("")}</div></div>`;
  const masc = makeMascot(JS ? "el-sallama" : "on", "sag");
  el.append(masc.el);
  stage.insertBefore(el, subEl);
  return { seg, el, masc, intro: true };
}
function buildOutro(seg) {
  const c = S.cikis;
  const el = document.createElement("div");
  el.className = "scene outro";
  const lock = `<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
  el.innerHTML = `<div class="glow"></div><div class="heading h1">${esc(c.baslik || "")}</div>
    <div class="url">${lock}<span class="txt"></span></div>
    <ul class="bullets">${(c.maddeler || []).map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
    <div class="foot"><img src="${LOGO}"><span>${esc(TXT.course)}</span></div>`;
  const masc = makeMascot(JS ? "el-sallama" : "tebrik", "sag");
  el.append(masc.el);
  stage.insertBefore(el, subEl);
  return { seg, el, masc, outro: true, url: c.adres || "30gunde.com.tr" };
}
const items = Z.segs.map((seg) => seg.tip === "giris" ? buildIntro(seg) : seg.tip === "cikis" ? buildOutro(seg) : buildScene(seg));

// kod satırlarını çizer; fixed ise düzeltilmiş kodu (eklenen harfler yeşil) gösterir
function drawCode(it, typed, caretOn, fixedCode) {
  if (fixedCode) {
    const lines = fixedCode.replace(/\n$/, "").split("\n");
    it.codeLines.forEach((x, i) => {
      const old = x.dataset.src, nw = lines[i] || "";
      let a = 0; while (a < old.length && old[a] === nw[a]) a++;
      const extra = nw.length - old.length;
      x.innerHTML = extra > 0 ? highlight(nw.slice(0, a)) + `<span class="ins">${esc(nw.slice(a, a + extra))}</span>` + highlight(nw.slice(a + extra)) : highlight(nw);
    });
    return;
  }
  let left = typed;
  it.codeLines.forEach((x) => {
    const src = x.dataset.src;
    const n = Math.max(0, Math.min(src.length, left));
    const showCaret = caretOn && left >= 0 && left <= src.length;
    left -= src.length;
    x.innerHTML = highlight(src.slice(0, n)) + (showCaret ? '<span class="caret"></span>' : "");
    if (showCaret) left = -1e9;
  });
}

function renderItem(it, t) {
  const seg = it.seg;
  const d = seg.t1 - seg.t0;
  const local = t - seg.t0;
  const visible = t >= seg.t0 - 0.001 && t < seg.t1 + 0.4;
  if (!visible) { it.el.style.opacity = 0; it.el.style.visibility = "hidden"; return; }
  it.el.style.visibility = "visible";
  const fadeIn = clamp(local / 0.4);
  const fadeOut = clamp((seg.t1 + 0.4 - t) / 0.4);
  it.el.style.opacity = Math.min(fadeIn, t < seg.t1 ? 1 : fadeOut);
  const speech = Math.max(0.1, seg.v1 - seg.v0);
  const sp = clamp((t - seg.v0) / speech);   // konuşmanın ilerleyişi

  let talkAmt = 0;
  if (it.masc) {
    talkAmt = it.masc.update(t, seg);
    const m = it.masc.el;
    if (m.classList.contains("orta")) m.style.marginLeft = -m.offsetWidth / 2 + "px";
    const k = ease(local / 0.5);
    const dir = m.classList.contains("sol") || m.classList.contains("alt-sol") ? -1 : 1;
    const bob = Math.sin(t * 2.2) * 8 - talkAmt * 6;
    m.style.transform = `translate(${(1 - k) * 140 * dir}px, ${bob}px) rotate(${Math.sin(t * 1.3) * 1.2}deg)`;
    m.style.opacity = k;
  }

  if (it.intro) {
    const lg = it.el.querySelector(".logo"); lg.style.transform = `scale(${easeBack((local - 0.1) / 0.5)})`;
    const br = it.el.querySelector(".brand"); br.style.opacity = ease((local - 0.3) / 0.4); br.style.transform = `translateX(${(1 - ease((local - 0.3) / 0.4)) * -30}px)`;
    const pill = it.el.querySelector(".pill"); pill.style.transform = `scale(${easeBack((local - 0.5) / 0.4)})`;
    const ti = it.el.querySelector(".title"); ti.style.opacity = ease((local - 0.7) / 0.5); ti.style.transform = `translateY(${(1 - ease((local - 0.7) / 0.5)) * 40}px)`;
    const lb = it.el.querySelector(".learn b"); lb.style.opacity = ease((t - seg.v0 - speech * 0.25) / 0.4);
    it.el.querySelectorAll(".chip").forEach((c, i, all) => {
      const at = seg.v0 + speech * (0.3 + 0.6 * i / all.length);
      const k = easeBack((t - at) / 0.4); c.style.opacity = clamp((t - at) / 0.25); c.style.transform = `scale(${0.6 + 0.4 * k})`;
    });
    it.el.querySelector(".glow").style.transform = `scale(${1 + 0.05 * Math.sin(t * 1.5)})`;
    return;
  }
  if (it.outro) {
    const h = it.el.querySelector(".heading"); h.style.opacity = ease(local / 0.5); h.style.transform = `translateY(${(1 - ease(local / 0.6)) * 30}px)`;
    const u = it.el.querySelector(".url"); const ku = easeBack((local - 0.3) / 0.5);
    u.style.transform = `scale(${(0.7 + 0.3 * ku) * (1 + 0.025 * Math.max(0, Math.sin((t - seg.t0) * 3.2)) * (local > 1.8 ? 1 : 0))})`; u.style.opacity = clamp((local - 0.3) / 0.3);
    const n = Math.floor(clamp((local - 0.6) / 1.0) * it.url.length);
    const blink = n < it.url.length || Math.floor(t * 2) % 2 === 0;
    u.querySelector(".txt").innerHTML = esc(it.url.slice(0, n)) + (blink ? '<span class="caret"></span>' : "");
    it.el.querySelectorAll(".bullets li").forEach((li, i, all) => {
      const at = seg.v0 + speech * (0.35 + 0.5 * i / all.length);
      const k = ease((t - at) / 0.4); li.style.opacity = k; li.style.transform = `translateX(${(1 - k) * 40}px)`;
    });
    it.el.querySelector(".glow").style.transform = `scale(${1 + 0.05 * Math.sin(t * 1.5)})`;
    return;
  }

  const head = it.el.querySelector(".heading, .title-big");
  if (head) head.style.transform = `translateY(${(1 - ease(local / 0.6)) * 30}px)`;
  it.el.querySelectorAll(".bullets li").forEach((li, i, all) => {
    const at = seg.v0 + speech * (0.02 + 0.75 * i / Math.max(all.length, 1));
    const k = ease((t - at) / 0.45);
    li.style.opacity = k; li.style.transform = `translateX(${(1 - k) * 40}px)`;
  });
  const code = it.el.querySelector(".code");
  const out = it.el.querySelector(".out");
  if (it.codeLines.length) {
    const kt = clamp((t - seg.typ0) / Math.max(0.01, seg.typ1 - seg.typ0));
    const typed = Math.floor(kt * it.codeLen);
    const fixNow = seg.fix_at != null && t >= seg.fix_at;
    drawCode(it, typed, kt < 1 && t >= seg.typ0 - 0.2, fixNow ? it.e.duzeltme.kod : null);
    const outOn = seg.out_at != null && t >= seg.out_at;
    it.codeLines.forEach((x) => {
      const ln = x.parentElement;
      const bad = it.s.tur === "hata" && outOn && !fixNow;
      ln.classList.toggle("bad", bad && ln.dataset.hl === "1");
      if (bad) ln.style.opacity = 0.75 + 0.25 * Math.cos((t - seg.out_at) * 8);
      else ln.style.opacity = 1;
      ln.classList.toggle("ok", fixNow && ln.dataset.hl === "1");
      ln.classList.toggle("hl", !bad && !fixNow && ln.dataset.hl === "1" && t > (seg.out_at ?? seg.typ1 + 0.4));
    });
    const run = code.querySelector(".run");
    if (run) { const pulse = seg.out_at != null && Math.abs(t - seg.out_at + 0.15) < 0.2; run.style.transform = `scale(${pulse ? 0.9 : 1})`; run.style.filter = pulse ? "brightness(1.3)" : ""; }
    if (out) {
      out.style.top = (code.offsetTop + code.offsetHeight + 30) + "px";
      const k = ease((t - (seg.out_at ?? 1e9)) / 0.3);
      out.style.opacity = k; out.style.transform = `translateY(${(1 - k) * 20}px)` + (it.s.tur === "hata" && !fixNow && k > 0 ? ` translateX(${Math.sin((t - seg.out_at) * 40) * 6 * clamp(1 - (t - seg.out_at) / 0.5)}px)` : "");
      if (fixNow && !it.fixed) {
        it.fixed = true; out.classList.remove("err"); out.classList.add("good");
        out.querySelector("b").textContent = TXT.output; out.querySelector("pre").textContent = it.e.duzeltme.cikti;
      } else if (!fixNow && it.fixed) {
        it.fixed = false; out.classList.add("err"); out.classList.remove("good");
        out.querySelector("b").textContent = TXT.error; out.querySelector("pre").textContent = it.e.cikti;
      }
      const grid = it.el.querySelector(".grid");
      if (grid) {
        grid.style.top = (out.offsetTop + out.offsetHeight + 24) + "px";
        const kg = ease((t - seg.out_at - 0.5) / 0.35); grid.style.opacity = kg;
        grid.querySelectorAll(".c").forEach((c, i) => { const kc = easeBack((t - seg.out_at - 0.6 - i * 0.07) / 0.3); c.style.transform = `scale(${kc})`; });
      }
    }
    const cnt = it.el.querySelector(".count");
    if (cnt && seg.sayac != null) {
      cnt.style.top = (code.offsetTop + code.offsetHeight + 40) + "px";
      const k = t - seg.sayac;
      cnt.style.opacity = k >= 0 && k < 3.1 ? ease(k / 0.2) : 0;
      const num = Math.max(1, 3 - Math.floor(Math.max(0, k)));
      cnt.querySelector(".num").textContent = num;
      const f = k - Math.floor(k); cnt.querySelector(".num").style.transform = `scale(${1 + 0.25 * Math.max(0, 1 - f / 0.25)})`;
    }
  } else if (out) { out.style.top = (V ? 420 : 300) + "px"; out.style.opacity = ease((t - seg.t0 - 0.5) / 0.3); }
  const pic = it.el.querySelector(".picture img");
  if (pic) {
    const p = clamp(local / d);
    const pop = it.s.tur === "kapanis" ? easeBack((local - 0.3) / 0.6) : 1;
    pic.style.transform = `scale(${(1 + 0.06 * p) * (0.4 + 0.6 * pop)}) translateY(${Math.sin(t * 1.2) * 6}px) rotate(${it.s.tur === "kapanis" ? Math.sin(t * 1.6) * 3 : 0}deg)`;
    pic.style.opacity = it.s.tur === "kapanis" ? clamp((local - 0.3) / 0.3) : 1;
  }
}

window.renderAt = function (t) {
  let cur = null;
  for (const it of items) { renderItem(it, t); if (t >= it.seg.t0 && t < it.seg.t1) cur = it; }
  // üst çubuk giriş/çıkış kartlarında gizli
  const onCard = cur && (cur.intro || cur.outro);
  topBar.style.opacity = onCard ? 0 : 1;
  // altyazı
  let text = "";
  if (cur) for (const s of cur.seg.subs) if (t >= s.a && t < s.b) { text = s.text; break; }
  subEl.textContent = text;
  subEl.style.display = window.SUBTITLES === false || !text ? "none" : "block";
  progEl.style.width = `${clamp(t / Z.sure) * 100}%`;
};
window.ready = Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.renderAt(0); return true; });
</script>
